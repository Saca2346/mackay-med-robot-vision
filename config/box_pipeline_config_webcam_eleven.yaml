model:
  weights: models/box_y26_maxB_544x960_openvino_model
  task: obb
  imgsz:
  - 544
  - 960
  device: intel:gpu.0
  iou: 0.5
  conf:
    box: 0.35
    size_label: 0.45
  cascade:
    enabled: false
    weights: models/box_v4s.pt
    imgsz: 1280
    device: cpu
    pad_frac: 0.25
classes:
  box: box
  size_label: size_label
grouping:
  min_label_overlap: 0.5
ocr:
  engine: rapidocr
  backend: onnxruntime
  min_confidence: 0.9
  retry_flip_below: 0.8
  min_crop_height: 48
  every_n_frames: 15
  every_n_frames_candidate: 5
  max_crops_per_frame: 2
  max_motion_px: 6
  threads: 2
  max_lost_frames: 10
matching:
  history: 5
  require_consistent: 2
  diameter_range_mm:
  - 1.0
  - 10.0
  length_range_mm:
  - 6
  - 60
selection:
  count_s: 1.5
  empty_s: 2.0
  gone_s: 2.0
  recheck_s: 5.0
  expected_count: 11
verify:
  catalog_csv: data/gtin_catalog.csv
  min_score: 2
  trust_unverified_catalog: false
  spine_bands: true
  min_box_width_px: 24
  ocr_full_box: true
  full_box_label_band: true    # Terumo REF line from the white label band (23-10, webcam: REF read 69% -> 81% of Accuforce readings)
  skip_dark_label_crops: true   # Terumo: do not read the dark TERUMO logo block as a size label (23-10 webcam A/B: OCR calls per Accuforce reading 5 -> 4)
  full_box_min_width_px: 40
  decode_barcodes: false
catalog:
- angiolite
- xperience pro
- essential pro
- accuforce
- ultimaster nagomi
- ryurei
- conqueror nc pro
- nc emerge
- agent
- sapphire
- scoreflex
- permanent sled bag
- chroma
- sequent please neo
camera:
  index: 1
  width: 1920
  height: 1080
  fps: 20
  backend: dshow
  fourcc: MJPG
output:
  screens_dir: results/focus_webcam_eleven/screens
  verify_log_csv: results/focus_webcam_eleven/verify_log.csv
visual:
  early_hint_refresh: false
  fast_read: true
  workers: 2
  target_seconds: 2
  defer_pending_seconds: 3
  warmup_text: true
  stabilize_outline: true
  parallel_target_reads: true
  joint_spine_read: true
  partial_spine_read: true
  record_width: 1280
  fast_spine_products:
  - angiolite
  - essential pro
  - xperience pro
  show_all: true
  request_ids:
  - K01
  - K03
  - K04
  - K05
  - K06
  - K07
  - K10
  - K15
  - K16
  - K17
  - K21
